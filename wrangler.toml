# Cloudflare Pages, con Functions en el MISMO ORIGEN (M8-1).
#
# ## Por qué Pages Functions y no un Worker aparte
#
# Es la decisión de la que cuelga todo lo demás. Un Worker en `api.motifyer.com`
# obligaría a las tres cosas a la vez:
#
#   - relajar `connect-src 'self'` en `_headers`, que es la directiva que hoy
#     hace literalmente imposible que esta aplicación hable con nadie;
#   - CORS con preflight, y por tanto un `Access-Control-Allow-Origin` emitido de
#     verdad, que es justo la puerta que este diseño mantiene cerrada;
#   - `SameSite=None` en la cookie de sesión, que es renunciar a la capa fuerte
#     de la defensa contra CSRF.
#
# Mismo origen: ninguna de las tres. `_headers` no se toca y `test/security.test.js`
# sigue verde sin modificarlo.
#
# El «sin bundler» también sobrevive: Pages empaqueta SOLO `functions/`, nunca
# mira `src/`, y el cliente sigue cargando módulos ES nativos.

name = "transformlab"
compatibility_date = "2026-08-21"

# La raíz del repo ES el sitio: no hay build. `functions/` se excluye sola —Pages
# la trata aparte— igual que `node_modules`.
pages_build_output_dir = "."

# ── Enlaces ────────────────────────────────────────────────────────────────────
#
# `--location=weur` al crear la base no es cosmética: fija que los datos
# —cifrados, pero datos personales al fin— se alojen en Europa occidental.
#
# El `database_id` NO es un secreto: es un identificador, no una credencial, y
# sin un token de la cuenta no sirve para nada. Cloudflare espera encontrarlo
# aquí, en el fichero versionado.
#
# CUIDADO CON `--remote`. `npm run serve:api` levanta `wrangler pages dev` contra
# una copia LOCAL de esta base, que es lo que se quiere para desarrollar. Añadir
# `--remote` para «probar de verdad» escribiría en la base de producción, con los
# datos de gente real dentro. Si hace falta mirar producción, se mira con
# `wrangler d1 execute --remote` y un `SELECT`.

[[d1_databases]]
binding = "DB"
database_name = "transformlab"
database_id = "4712b8a1-fc69-4838-ad78-edb77a394067"
migrations_dir = "migrations"

# Las fotos. El bucket existe desde el principio aunque no se use hasta M9-5:
# declararlo ya hace que `GET /api/health` diga la verdad sobre lo que hay.
#
# `jurisdiction = "eu"` es OBLIGATORIO aquí, no una preferencia. El bucket se
# creó con `--jurisdiction=eu`, y un bucket con jurisdicción vive en un espacio
# de nombres aparte: sin esta línea, el enlace apunta al espacio por defecto, no
# encuentra nada y falla en tiempo de ejecución. Es también la razón de que
# `wrangler r2 bucket list` a secas no lo liste — hay que pedirlo con la misma
# jurisdicción.
#
# Y lo que compra: los objetos —fotos de progreso, cifradas, pero de una persona
# identificable por quien tenga la clave— no salen de la UE.

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "transformlab-photos"
jurisdiction = "eu"

# ── Entrar con Google (M10) ────────────────────────────────────────────────────
#
# El ID de cliente es PÚBLICO: viaja en la URL a la que se manda el navegador,
# así que cualquiera que pulse «entrar con Google» lo ve. No es una credencial y
# Cloudflare espera encontrarlo aquí, en el fichero versionado.
#
# El SECRETO no está aquí y no puede estarlo:
#
#     npx wrangler pages secret put GOOGLE_CLIENT_SECRET --project-name=transformlab
#
# Sin ninguno de los dos, `/api/auth/google/start` devuelve 503 y la aplicación
# sigue funcionando entera con passkeys. Es a propósito: una integración
# opcional que no está configurada tiene que degradar, no romper.

[vars]
GOOGLE_CLIENT_ID = "525723957048-q018dbh80p3k9d0imiruntkqgrqk20qm.apps.googleusercontent.com"
