<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransformLab | Sistema Adaptativo de Transformación Física</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles_new.css">
</head>
<body>
    <!-- Cursor Glow Effect -->
    <div id="cursorGlow" class="cursor-glow"></div>
    
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Cargando datos de transformación...</p>
    </div>

    <!-- Main Container -->
    <div class="app-container">
        
        <!-- Header -->
        <header class="app-header">
            <div class="header-brand">
                <h1 class="brand-title">Transform<span class="brand-accent">Lab</span></h1>
                <span class="brand-tagline">Visualizador de Transformación Física</span>
            </div>
            <div id="headerInfo" class="header-info">
                <!-- Renderizado dinámico -->
            </div>
        </header>

        <!-- Navigation Bar -->
        <nav class="nav-bar">
            <!-- Granularity Selector -->
            <div class="granularity-selector">
                <button class="granularity-btn" data-granularity="daily">Día</button>
                <button class="granularity-btn active" data-granularity="weekly">Semana</button>
                <button class="granularity-btn" data-granularity="monthly">Mes</button>
            </div>
            
            <!-- Timeline -->
            <div class="timeline-container">
                <div id="timelineBar" class="timeline-bar">
                    <div id="phaseMarkers" class="phase-markers"></div>
                    <div id="timelineProgress" class="timeline-progress"></div>
                    <div id="timelinePosition" class="timeline-position"></div>
                </div>
            </div>
            
            <!-- Navigation Controls -->
            <div class="nav-controls">
                <button id="navPrev" class="nav-btn">‹</button>
                <span id="navLabel" class="nav-label">Semana 1</span>
                <button id="navNext" class="nav-btn">›</button>
                <button id="navToday" class="nav-btn-today">Hoy</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="mainContent" class="main-content">
            
            <!-- Dashboard Row -->
            <section class="dashboard-row">
                <!-- Metric Cards -->
                <div id="physicalCard" class="metric-card physical">
                    <!-- Renderizado dinámico -->
                </div>
                <div id="performanceCard" class="metric-card performance">
                    <!-- Renderizado dinámico -->
                </div>
                <div id="wellbeingCard" class="metric-card wellbeing">
                    <!-- Renderizado dinámico -->
                </div>
                <div id="metabolicCard" class="metric-card metabolic">
                    <!-- Renderizado dinámico -->
                </div>
            </section>

            <!-- Phase & Goals Row -->
            <section class="phase-goals-row">
                <div id="phaseIndicator" class="phase-indicator-card">
                    <!-- Renderizado dinámico -->
                </div>
                <div id="goalProgress" class="goal-progress-card">
                    <!-- Renderizado dinámico -->
                </div>
            </section>

            <!-- Chart Section -->
            <section class="chart-section">
                <div class="chart-card">
                    <div class="chart-header">
                        <h2>📊 Progresión</h2>
                        <div class="metric-toggles">
                            <button class="metric-toggle active" data-metric="weight" style="--toggle-color: #00d4ff">Peso</button>
                            <button class="metric-toggle active" data-metric="muscleKg" style="--toggle-color: #48bb78">Músculo</button>
                            <button class="metric-toggle" data-metric="fatPct" style="--toggle-color: #ff6b6b">% Grasa</button>
                            <button class="metric-toggle" data-metric="fatKg" style="--toggle-color: #ff9f43">Grasa kg</button>
                            <button class="metric-toggle" data-metric="strength" style="--toggle-color: #f6ad55">Fuerza</button>
                            <button class="metric-toggle" data-metric="aesthetics" style="--toggle-color: #ed64a6">Estética</button>
                        </div>
                    </div>
                    
                    <!-- Hover Panel -->
                    <div id="hoverPanel" class="hover-panel">
                        <div class="hover-placeholder">
                            <span>👆 Pasa el ratón sobre el gráfico para ver detalles</span>
                        </div>
                    </div>
                    
                    <!-- Chart -->
                    <div class="chart-wrapper">
                        <canvas id="mainChart"></canvas>
                    </div>
                </div>
            </section>

            <!-- Insights Panel -->
            <section class="insights-row">
                <div id="insightsPanel" class="insights-panel">
                    <!-- Renderizado dinámico -->
                </div>
            </section>

        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>TransformLab v3.0 · Cálculos: Mifflin-St Jeor, Aragon 2017, McDonald/Helms · Plan personalizado</p>
        </footer>

    </div>

    <!-- Scripts -->
    <script src="js/calculations.js"></script>
    <script src="js/dynamic-data-generator.js"></script>
    <script src="js/onboarding.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/insights.js"></script>
</body>
</html>
