<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransformLab</title>
    <meta name="description" content="Seguimiento de transformación corporal con proyección recalibrable. Funciona sin cuenta; si la creas, se sincroniza cifrada de extremo a extremo.">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="color-scheme" content="dark">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TransformLab">

    <!-- Open Graph: al compartir el enlace se ve de qué va y, sobre todo,
         que sin cuenta los datos no salen del navegador, y que con ella viajan
         cifrados de extremo a extremo. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="TransformLab">
    <meta property="og:title" content="TransformLab">
    <meta property="og:description" content="Seguimiento de transformación corporal con proyección recalibrable. Funciona sin cuenta; si la creas, se sincroniza cifrada de extremo a extremo.">
    <!-- URL ABSOLUTA a propósito: Open Graph la exige, y los rastreadores de
         WhatsApp, LinkedIn o Facebook no resuelven una ruta relativa. Es lo
         único del proyecto que codifica el dominio. -->
    <meta property="og:url" content="https://motifyer.com/">
    <meta property="og:image" content="https://motifyer.com/icons/og-image.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="TransformLab">
    <meta property="og:locale" content="es_ES">
    <meta name="twitter:card" content="summary">


    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/app.css">

</head>
<body>
    <div id="app"></div>
    <noscript>
        <p>TransformLab necesita JavaScript. / TransformLab requires JavaScript.</p>
    </noscript>
    <!-- Chart.js NO se carga aquí: son 208 KB que no pintan nada de la
         primera pantalla. Lo pide `src/ui/chart.js` cuando toca dibujar una
         gráfica, desde vendor/ y nunca desde un CDN (CSP 'self' y offline).
         Si falla, la vista avisa y la aplicación sigue funcionando. -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
